# Verificación automática en cada push y pull request.
name: Verificación

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Sintaxis del formulario y scripts
        run: |
          for f in public/*.js scripts/*.mjs; do cp "$f" /tmp/check.mjs; node --check /tmp/check.mjs && echo "✔ $f"; done
          node --check scripts/build-config.cjs

      - name: Build de prueba (formulario + panel React)
        env:
          SUPABASE_URL: https://ziqfcmgufkeydulgtnvl.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_d1FISB2wU-5HvJdUh-kkUA_oB2XiYh_
        run: npm run build

      - name: Reporte diario en modo demo
        run: node scripts/reporte-diario.mjs --demo

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Tipos de las Edge Functions
        working-directory: supabase/functions
        env:
          DENO_NO_PACKAGE_JSON: "1"
        run: deno check registrar-visita/index.ts registrar-acceso/index.ts admin-usuarios/index.ts enviar-reporte/index.ts
